name: Render and Deploy Quarto Site

on:
  push:
    branches: [master]     # deploys automatically when redesign work is merged into main
  workflow_dispatch: {}   # allows manual runs from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.6.42"

      - name: Set up Python (for executable Python code chunks)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install jupyter matplotlib scikit-learn pandas numpy

      # Uncomment if/when R-based tutorials with executable code are added:
      # - name: Set up R
      #   uses: r-lib/actions/setup-r@v2
      # - name: Install R dependencies
      #   uses: r-lib/actions/setup-r-dependencies@v2
      #   with:
      #     packages: |
      #       any::rmarkdown
      #       any::knitr
      #       any::tidyverse

      - name: Render site
        run: quarto render

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
